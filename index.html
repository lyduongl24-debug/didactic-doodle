<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dịch tiếng Trung - Công xưởng</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d9dce1;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #c0392b;
    --accent-hover: #a93225;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --panel: #1f2226;
      --border: #33373d;
      --text: #e6e7ea;
      --muted: #9aa0a8;
      --accent: #e0564a;
      --accent-hover: #ef6a5e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  select, button, input[type="file"]::file-selector-button {
    font: inherit;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  select:hover, button:hover:not(:disabled), input[type="file"]::file-selector-button:hover {
    border-color: var(--accent);
  }
  #swap { font-size: 1rem; padding: 8px 10px; }
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 720px) {
    .panels { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  textarea {
    width: 100%;
    min-height: 320px;
    resize: vertical;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 1rem;
    line-height: 1.5;
  }
  .panel-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    gap: 8px;
  }
  .actions-row {
    display: flex;
    justify-content: center;
    margin: 16px 0;
    gap: 10px;
  }
  #translate {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    padding: 10px 28px;
    font-weight: 600;
  }
  #translate:hover:not(:disabled) { background: var(--accent-hover); }
  #translate:disabled { opacity: 0.6; cursor: default; }
  #status {
    text-align: center;
    min-height: 1.2em;
    color: var(--muted);
    font-size: 0.88rem;
    margin-top: 4px;
  }
  #status.error { color: var(--accent); }
  .hint {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 20px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dịch tiếng Trung - Công xưởng</h1>
  <p class="subtitle">Dịch văn bản tự do Việt ⇄ Trung, dùng để dịch tài liệu, thông báo, hướng dẫn trong công xưởng.</p>

  <div class="toolbar">
    <select id="direction">
      <option value="zh-CN|vi">中文 → Tiếng Việt</option>
      <option value="vi|zh-CN">Tiếng Việt → 中文</option>
    </select>
    <button id="swap" title="Đổi chiều dịch">⇄ Đổi chiều</button>
    <label style="margin-left:auto; font-size:0.85rem; color:var(--muted);">
      Tải tệp .txt:
      <input id="fileInput" type="file" accept=".txt">
    </label>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-head">
        <span id="inputLabel">中文</span>
        <span id="charCount">0 ký tự</span>
      </div>
      <textarea id="input" placeholder="Dán văn bản tiếng Trung hoặc tiếng Việt vào đây..."></textarea>
      <div class="panel-foot">
        <button id="clear">Xóa</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span id="outputLabel">Tiếng Việt</span>
      </div>
      <textarea id="output" readonly placeholder="Bản dịch sẽ hiện ở đây..."></textarea>
      <div class="panel-foot">
        <button id="copy">Sao chép</button>
        <button id="download">Tải bản dịch (.txt)</button>
      </div>
    </div>
  </div>

  <div class="actions-row">
    <button id="translate">Dịch</button>
  </div>
  <div id="status"></div>

  <p class="hint">Dùng dịch vụ dịch công cộng miễn phí, không cần đăng ký. Với tài liệu quan trọng, hãy kiểm tra lại bản dịch trước khi sử dụng.</p>
</div>

<script>
(function () {
  const directionSel = document.getElementById('direction');
  const swapBtn = document.getElementById('swap');
  const inputEl = document.getElementById('input');
  const outputEl = document.getElementById('output');
  const translateBtn = document.getElementById('translate');
  const clearBtn = document.getElementById('clear');
  const copyBtn = document.getElementById('copy');
  const downloadBtn = document.getElementById('download');
  const statusEl = document.getElementById('status');
  const charCountEl = document.getElementById('charCount');
  const fileInput = document.getElementById('fileInput');
  const inputLabel = document.getElementById('inputLabel');
  const outputLabel = document.getElementById('outputLabel');

  const LABELS = { 'zh-CN': '中文', 'vi': 'Tiếng Việt' };
  const MAX_CHUNK = 4500;

  function updateLabels() {
    const [sl, tl] = directionSel.value.split('|');
    inputLabel.textContent = LABELS[sl];
    outputLabel.textContent = LABELS[tl];
  }

  function updateCharCount() {
    charCountEl.textContent = inputEl.value.length + ' ký tự';
  }

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.classList.toggle('error', !!isError);
  }

  function splitIntoChunks(text) {
    const paragraphs = text.split(/(\n)/); // keep newlines as their own tokens
    const chunks = [];
    let current = '';
    for (const part of paragraphs) {
      if ((current + part).length > MAX_CHUNK && current.length > 0) {
        chunks.push(current);
        current = part;
      } else {
        current += part;
      }
    }
    if (current.length > 0) chunks.push(current);
    return chunks.length ? chunks : [''];
  }

  async function translateChunk(text, sl, tl) {
    if (!text.trim()) return text;
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' +
      encodeURIComponent(sl) + '&tl=' + encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || !Array.isArray(data[0])) throw new Error('Phản hồi không hợp lệ');
    return data[0].map(seg => seg[0]).join('');
  }

  async function doTranslate() {
    const text = inputEl.value;
    if (!text.trim()) {
      setStatus('Vui lòng nhập văn bản cần dịch.', true);
      return;
    }
    const [sl, tl] = directionSel.value.split('|');
    translateBtn.disabled = true;
    setStatus('Đang dịch...');
    outputEl.value = '';
    try {
      const chunks = splitIntoChunks(text);
      const results = [];
      for (const chunk of chunks) {
        results.push(await translateChunk(chunk, sl, tl));
      }
      outputEl.value = results.join('');
      setStatus('Đã dịch xong.');
    } catch (err) {
      setStatus('Không thể dịch: ' + err.message + '. Vui lòng thử lại.', true);
    } finally {
      translateBtn.disabled = false;
    }
  }

  swapBtn.addEventListener('click', () => {
    const [sl, tl] = directionSel.value.split('|');
    directionSel.value = tl + '|' + sl;
    const tmp = inputEl.value;
    inputEl.value = outputEl.value;
    outputEl.value = tmp;
    updateLabels();
    updateCharCount();
    setStatus('');
  });

  directionSel.addEventListener('change', updateLabels);
  inputEl.addEventListener('input', updateCharCount);
  translateBtn.addEventListener('click', doTranslate);

  clearBtn.addEventListener('click', () => {
    inputEl.value = '';
    outputEl.value = '';
    updateCharCount();
    setStatus('');
  });

  copyBtn.addEventListener('click', async () => {
    if (!outputEl.value) return;
    try {
      await navigator.clipboard.writeText(outputEl.value);
      setStatus('Đã sao chép bản dịch.');
    } catch {
      outputEl.select();
      document.execCommand('copy');
      setStatus('Đã sao chép bản dịch.');
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!outputEl.value) return;
    const blob = new Blob([outputEl.value], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ban-dich.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      inputEl.value = reader.result;
      updateCharCount();
      setStatus('Đã tải nội dung từ tệp "' + file.name + '".');
    };
    reader.onerror = () => setStatus('Không đọc được tệp.', true);
    reader.readAsText(file, 'utf-8');
  });

  updateLabels();
  updateCharCount();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
